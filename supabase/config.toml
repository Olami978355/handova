# process-payment-webhook is called by Paystack, an external service that
# cannot send a Supabase JWT. It authenticates requests using its own
# HMAC-SHA512 signature (verified inside the function itself via the
# x-paystack-signature header), so the platform-level JWT check must be
# disabled here — otherwise Supabase's gateway rejects the request with
# a 401 before our function code ever runs.
[functions.process-payment-webhook]
verify_jwt = false

# paystack-transfer-webhook is also called by Paystack (payout events) and
# verifies the x-paystack-signature header itself, so the platform JWT check
# must be off here as well.
[functions.paystack-transfer-webhook]
verify_jwt = false

[functions.dispatch-notification]
verify_jwt = false

[functions.release-inspection-fees]
verify_jwt = false

[functions.refund-expired-lawyer-bookings]
verify_jwt = false

[functions.auto-expire-decisions]
verify_jwt = false

[functions.process-inspection-payment]
verify_jwt = false
